[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "readonly-imap-mcp"
version = "0.1.0"
description = "Local read-only IMAP MCP prototype"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
readonly-imap-mcp = "imap_connector.server:main"

[tool.setuptools.packages.find]
include = ["imap_connector*"]

[tool.pytest.ini_options]
pythonpath = ["."]
